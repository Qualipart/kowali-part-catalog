name: Build Kowali Part APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'kowali-android-apk-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: test -f kowali-android-apk-source.zip

      - name: Extract Android project
        run: |
          mkdir -p /tmp/kowali-source
          unzip -q kowali-android-apk-source.zip -d /tmp/kowali-source
          test -f /tmp/kowali-source/kowali-android-apk/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: /tmp/kowali-source/kowali-android-apk
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kowali-part-mohammadi-apk
          path: /tmp/kowali-source/kowali-android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

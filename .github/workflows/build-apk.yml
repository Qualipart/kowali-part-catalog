name: Build Kowali Part APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Android project
        run: |
          unzip -o kowali-android-apk-source.zip -d .
          ls -la

      - name: Build APK
        working-directory: kowali-android-apk
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kowali-part-apk
          path: kowali-android-apk/app/build/outputs/apk/debug/app-debug.apk
